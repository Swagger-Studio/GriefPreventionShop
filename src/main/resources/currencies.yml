# ==========================================================
# CURRENCY CONFIGURATION
# ==========================================================

# Active currency used in the shop.
# Options:
#   - "auto"          : Automatically detects any installed economy (Vault, VaultUnlocked, PlayerPoints, etc.)
#                       and safely falls back to Experience (XP) if no third-party economy plugin is found.
#   - "Vault"         : Standard Vault / VaultUnlocked economy (requires an economy plugin like TheNewEconomy, EssentialsX, XConomy)
#   - "VaultUnlocked" : VaultUnlocked economy
#   - "PlayerPoints"  : PlayerPoints plugin
#   - "ExcellentEconomy" : ExcellentEconomy / CoinsEngine
#   - "Experience"    : Vanilla Minecraft XP levels (No extra plugins required!)
active-currency: "Vault"

currencies:
  Vault:
    register: true
    raw: "&eMoney"

  VaultUnlocked:
    register: true
    raw: "&eMoney"

  PlayerPoints:
    register: true
    raw: "&ePoints"

  # CoinsEngine Plugin Now ExcellentEconomy

  ExcellentEconomy:
    register: true
    currency-id: "coins"
    raw: "&eCoins"

  Experience:
    register: true
    raw: "&eXP"
